<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#12100E">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Lap Log — Backyard Crew</title>
<style>
:root, [data-theme="dark"]{
  --bg:#12100E;
  --panel:#1C1917;
  --panel-2:#262220;
  --line:#332E2A;
  --amber:#FFB000;
  --amber-dim:#C98A18;
  --text:#EDE6DC;
  --muted:#8A8078;
  --green:#6FCF7F;
  --red:#E0574A;
  --blue:#7FB2E0;
  --on-amber:#1A1206;
  --on-blue:#0A1520;
  --sel-bg:#2A2008;
  --alert-bg:#2A1614;
  --alert-line:#4A2E2A;
  --ok-line:#2E4A34;
  --plan-line:#4A4038;
  --shadow:none;
  --r:10px;
  --tap:56px;
}
[data-theme="light"]{
  --bg:#F5F2EC;
  --panel:#FFFFFF;
  --panel-2:#F0EBE2;
  --line:#DED6C8;
  --amber:#A85406;
  --amber-dim:#8A4405;
  --text:#1F1B16;
  --muted:#6B6259;
  --green:#15803D;
  --red:#B3261E;
  --blue:#1D4ED8;
  --on-amber:#FFFFFF;
  --on-blue:#FFFFFF;
  --sel-bg:#FBEEDB;
  --alert-bg:#FBE6E4;
  --alert-line:#E2B4AF;
  --ok-line:#B4D9C0;
  --plan-line:#C6BBAA;
  --shadow:0 1px 2px rgba(31,27,22,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:16px;line-height:1.35;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:.02em}
.eyebrow{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin:0 0 8px
}
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
  display:flex;align-items:baseline;gap:10px;justify-content:space-between
}
header .lapno{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
header .lapno b{color:var(--amber);font-size:20px;letter-spacing:0}
.badge{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.on{color:var(--green);border-color:var(--ok-line)}
.badge.off{color:var(--red);border-color:var(--alert-line)}
main{padding:14px 14px 20px;max-width:640px;margin:0 auto}
section{margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}

/* ---- hero: the downtime clock ---- */
.clock{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 14px 14px;text-align:center;position:relative;overflow:hidden
}
.clock.live{border-color:var(--amber-dim)}
.clock .t{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:clamp(52px,19vw,76px);line-height:.92;letter-spacing:-.02em;
  color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums
}
.clock.live .t{color:var(--amber)}
.clock .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.clock .sub{font-size:12px;color:var(--muted);margin-top:2px}
.pulse{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--amber);opacity:0}
.clock.live .pulse{opacity:1;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.clock.live .pulse{animation:none}}

.bigrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.big{
  min-height:64px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel-2);font-size:15px;font-weight:650;
  letter-spacing:.1em;text-transform:uppercase
}
.big:active{transform:translateY(1px)}
.big.primary{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}
.big.ghost{color:var(--muted)}
.big[disabled]{opacity:.32}
.big.wide{grid-column:1 / -1}

/* ---- chips ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:var(--tap);padding:8px 14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);
  font-size:15px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  flex:1 1 auto;min-width:calc(50% - 4px)
}
.chip .sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.chip[data-s="1"]{border-color:var(--amber);background:var(--sel-bg);color:var(--amber)}
.chip[data-s="1"] .sub{color:var(--amber-dim)}
.chip[data-s="2"]{border-color:var(--alert-line);background:var(--alert-bg);color:var(--red);text-decoration:line-through}
.chip[data-s="2"] .sub{color:var(--red);text-decoration:none}
.chip.planned:not([data-s="1"]):not([data-s="2"]){border-style:dashed;border-color:var(--plan-line)}
.legend{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.02em}

/* ---- segmented ---- */
.seg{display:grid;gap:6px;grid-auto-flow:column;grid-auto-columns:1fr}
.seg button{
  min-height:var(--tap);border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel-2);font-size:15px;font-weight:600
}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}
.seg.sm button{min-height:46px;font-size:14px}
.seg.tone button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.carry{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);float:right;font-weight:600}

/* ---- symptoms ---- */
.sym{display:flex;flex-wrap:wrap;gap:8px}
.sym button{
  min-height:50px;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel-2);font-size:14px;flex:1 1 auto;min-width:calc(33% - 6px)
}
.sym button[aria-pressed="true"]{background:var(--alert-bg);border-color:var(--red);color:var(--red);font-weight:650}
.sym button .new{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}

textarea,input[type=text],input[type=time],input[type=number],input[type=url]{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
  color:var(--text);padding:12px;font:inherit
}
textarea{min-height:70px;resize:vertical}
input[type=time]{min-height:var(--tap);font-size:20px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.9;cursor:pointer;width:22px;height:22px;padding:4px}
[data-theme="light"] input[type=time]::-webkit-calendar-picker-indicator{filter:none;opacity:.7}
.latebar{margin-top:12px;padding:12px;border:1px solid var(--amber);border-radius:var(--r);background:var(--sel-bg);color:var(--amber);font-size:13px;text-align:center;letter-spacing:.04em;font-weight:600}
.nudge{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:10px}
.nudge button{min-height:46px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);font-size:14px;font-weight:600}
.nudge button:active{background:var(--amber);color:var(--on-amber)}
label.f{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:600}

/* ---- nav ---- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}
nav button{padding:12px 4px 10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
nav button[aria-current="true"]{color:var(--amber);box-shadow:inset 0 2px 0 var(--amber)}
nav button .n{display:block;font-size:17px;margin-bottom:3px;font-weight:500}

/* ---- log list ---- */
.laprow{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.laprow .n{font-size:19px;color:var(--amber);min-width:34px}
.laprow .m{flex:1;min-width:0}
.laprow .m .a{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.laprow .m .b{font-size:11px;color:var(--muted);margin-top:2px}
.laprow .d{font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* ---- modal ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--panel);border:1px solid var(--red);border-radius:var(--r);padding:18px;max-width:420px;width:100%;max-height:86vh;overflow:auto}
.modal h3{color:var(--red);margin-bottom:10px}
.modal ul{margin:10px 0 0;padding-left:18px}
.modal li{margin-bottom:8px;font-size:15px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));
  background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:10px 18px;
  font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none
}
.toast.show{opacity:1}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.warn{border-left:3px solid var(--amber);padding-left:10px;color:var(--amber-dim);font-size:13px;margin:10px 0}
.err{border-left:3px solid var(--red);padding-left:10px;color:var(--red);font-size:13px;margin:10px 0}
hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:none}
.kv b{color:var(--amber);font-weight:600}
details{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:10px 0}
summary{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;cursor:pointer}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:11px;color:var(--muted)}


.strap{font-size:12px;color:var(--muted);margin:-4px 0 12px;line-height:1.4}
.sublabel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.sectot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--amber);text-align:right}
.portions{flex:1 1 100%;margin:-2px 0 4px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:var(--r);background:var(--panel-2)}
.portions .plabel{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.editbar{background:var(--sel-bg);border:1px solid var(--amber);color:var(--amber);border-radius:var(--r);padding:10px 12px;margin-bottom:14px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;text-align:center}
.pnote{font-size:14px;margin:0 0 8px;padding-left:10px;border-left:2px solid var(--amber-dim);color:var(--text)}
.pnote:last-child{margin-bottom:0}
.bar{height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin:2px 0 10px}
.bar i{display:block;height:100%;border-radius:3px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style></head>
<body>
<header>
  <div class="lapno">Hour <b id="hLap">1</b> <span id="hOf" style="color:var(--muted)">/ 48</span></div>
  <div style="display:flex;gap:6px">
    <span class="badge" id="bSave">saving…</span>
    <span class="badge" id="bSync">sync off</span>
  </div>
</header>
<main id="view"></main>
<nav>
  <button data-tab="lap" aria-current="true"><span class="n">◉</span>Hour</button>
  <button data-tab="log"><span class="n">≡</span>Log</button>
  <button data-tab="out"><span class="n">↥</span>Export</button>
  <button data-tab="set"><span class="n">⚙</span>Setup</button>
</nav>
<div class="toast" id="toast"></div>

/* migrate v1/v2 records into the course/camp model */
(function migrate(){
  const fix=l=>{
    if(!l) return;
    if(!l.course){
      l.course=blankSection(); l.camp=blankSection();
      l.course.drink=l.drink||null; l.course.amt=l.drinkAmt||"all";
      l.camp.drink=l.drink2||null; l.camp.amt=l.drink2Amt||"all";
      Object.keys(l.items||{}).forEach(id=>{
        const v=l.items[id]; const e=(typeof v==="number")?{s:v,q:1}:v;
        const p=prod(id);
        (p&&p.drink?l.course:l.camp).items[id]=e;
      });
      l.course.extra=(l.extra||[]).slice(); 
      delete l.drink; delete l.drinkAmt; delete l.drink2; delete l.drink2Amt;
      delete l.items; delete l.extra; delete l.departed;
    }
    if(l.urine!==undefined) delete l.urine;
    if(l.maint) l.maint=l.maint.map(m=>m==="Feet"?"Feet check":m);
    if(l.symptoms) l.symptoms=l.symptoms.filter(x=>x!=="Urgency");
  };
  S.laps.forEach(fix); fix(S.cur); delete S.onsets["Urgency"];
})();

function sectionTotals(sec,t){
  if(!sec) return;
  if(sec.drink){ const p=prod(sec.drink);
    if(p){ const f=(AMOUNTS.find(a=>a.k===sec.amt)||{f:1}).f;
      t.kcal+=p.kcal*f; t.carb+=p.carb*f; t.na+=p.na*f; t.caf+=p.caf*f; t.ml+=p.ml*f;
      if(p.est)t.est=true; if(p.unset)t.unset=true; } }
  Object.keys(sec.items||{}).forEach(id=>{
    const e=sec.items[id]; if(!e||e.s!==1) return;
    const p=prod(id); if(!p) return; const q=e.q==null?1:e.q;
    t.kcal+=p.kcal*q; t.carb+=p.carb*q; t.na+=p.na*q; t.caf+=p.caf*q; t.ml+=p.ml*q;
    if(p.est)t.est=true; if(p.unset)t.unset=true; });
  if((sec.extra||[]).length) t.est=true;
}
function totals(l){ const t={kcal:0,carb:0,na:0,caf:0,ml:0,est:false,unset:false};
  sectionTotals(l.course,t); sectionTotals(l.camp,t); return t; }
function secTotal(sec){ const t={kcal:0,carb:0,na:0,caf:0,ml:0,est:false,unset:false};
  sectionTotals(sec,t); return t; }
function cumulative(){
  const a={kcal:0,carb:0,na:0,ml:0}, p={kcal:0,carb:0,na:0,ml:0};
  S.laps.forEach(l=>{ const t=totals(l);
    a.kcal+=t.kcal; a.carb+=t.carb; a.na+=t.na; a.ml+=t.ml;
    const q=planTarget(l.n); p.kcal+=q.kcal; p.carb+=q.carb; p.na+=q.na; p.ml+=q.ml; });
  return {a,p,n:S.laps.length};
}

function medianLap(){ const d=S.laps.map(lapRunMs).filter(x=>x!=null&&x>0).sort((a,b)=>a-b);

function medianCamp(){ const d=S.laps.map(campMs).filter(x=>x!=null&&x>0).sort((a,b)=>a-b);
  return d.length?mmss(d[Math.floor(d.length/2)]):"––:––"; }

/* ---------- CSV ---------- */
const COLS=["lap","bell","arrived","lap_min","camp_min",
 "course_drink","course_drink_amt","course_food",
 "camp_drink","camp_drink_amt","camp_food",
 "refused","other",
 "kcal","carb_g","sodium_mg","fluid_ml","caffeine_mg",
 "plan_kcal","plan_carb_g","plan_sodium_mg","plan_fluid_ml",
 "temp_c","conditions","gut","mood","legs","layers","toilet","swelling","symptoms","symptom_other",
 "new_onsets","maintenance","notes","flags"];
function csvCell(v){ v=v==null?"":String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function foodStr(sec){ return Object.keys(sec.items).filter(k=>sec.items[k].s===1)
  .map(k=>`${(prod(k)||{}).name||k} x${sec.items[k].q==null?1:sec.items[k].q}`).join("; "); }
function refusedStr(l){ return ["course","camp"].flatMap(w=>Object.keys(l[w].items)
  .filter(k=>l[w].items[k].s===2).map(k=>(prod(k)||{}).name||k)).join("; "); }
function buildCSV(){
  const lines=[COLS.join(",")];
  [...S.laps].sort((a,b)=>a.n-b.n).forEach(l=>{
    const t=totals(l), g=planTarget(l.n);
    const flags=[t.est?"ESTIMATED_VALUES":"",t.unset?"UNSET_PRODUCT":"",l.swell==="yes"?"SWELLING":""].filter(Boolean).join(" ");
    lines.push([l.n,hhmmss(whistle(l.n)),hhmmss(l.arrived),mins(lapRunMs(l)),mins(campMs(l)),
      l.course.drink?((prod(l.course.drink)||{}).name||l.course.drink):"", l.course.drink?l.course.amt:"", foodStr(l.course),
      l.camp.drink?((prod(l.camp.drink)||{}).name||l.camp.drink):"", l.camp.drink?l.camp.amt:"", foodStr(l.camp),
      refusedStr(l), (l.course.extra||[]).concat(l.camp.extra||[]).join("; "),
      round(t.kcal),round(t.carb),round(t.na),round(t.ml),round(t.caf),
      g.kcal,g.carb,g.na,g.ml,
      l.temp??"",(l.wx||[]).join("; "),
      l.gut??"",l.mood??"",l.legs??"",l.layers??"",l.toilet||"",l.swell||"",
      l.symptoms.join("; "),l.symOther||"",l.newOnsets.join("; "),l.maint.join("; "),
      (l.notes||"").replace(/\n/g," "),flags].map(csvCell).join(","));
  });
  return lines.join("\n");
}
function parseCSVLine(line){
  const out=[]; let cur="",q=false;
  for(let i=0;i<line.length;i++){ const c=line[i];
    if(q){ if(c==='"'&&line[i+1]==='"'){cur+='"';i++;} else if(c==='"')q=false; else cur+=c; }
    else{ if(c==='"')q=true; else if(c===","){out.push(cur);cur="";} else cur+=c; } }
  out.push(cur); return out;
}
function importCSV(text){
  const rows=text.replace(/\r/g,"").split("\n").filter(r=>r.trim());
  if(!rows.length) throw new Error("empty file");
  const head=parseCSVLine(rows[0]); const ix=n=>head.indexOf(n);
  if(ix("lap")<0) throw new Error("no 'lap' column — is this a lap log CSV?");
  const byName=n=>{ const p=S.products.find(p=>p.name===n); return p?p.id:null; };
  const base=S.raceStart?new Date(S.raceStart):new Date();
  const toTs=t=>{ if(!t) return null; const [h,m,s]=t.split(":").map(Number);
    const d=new Date(base); d.setHours(h||0,m||0,s||0,0); return d.getTime(); };
  const laps=[],onsets={};
  rows.slice(1).forEach(r=>{
    const c=parseCSVLine(r), g=n=>{const i=ix(n); return i<0?"":c[i];};
    const n=parseInt(g("lap"),10); if(!n) return;
    const l=blankLap(n);
    l.arrived=toTs(g("arrived"));
    if(l.arrived && S.raceStart && l.arrived < whistle(n)) l.arrived+=864e5;
    const fill=(sec,dk,ak,fk)=>{
      sec.drink=byName(g(dk))||null; sec.amt=g(ak)||"all";
      g(fk).split(";").map(x=>x.trim()).filter(Boolean).forEach(s=>{
        const m=s.match(/^(.*?)\s+x([\d.]+)$/); const nm=m?m[1]:s, q=m?parseFloat(m[2]):1;
        const id=byName(nm); if(id) sec.items[id]={s:1,q}; else sec.extra.push(s); });
    };
    fill(l.course,"course_drink","course_drink_amt","course_food");
    fill(l.camp,"camp_drink","camp_drink_amt","camp_food");
    g("refused").split(";").map(x=>x.trim()).filter(Boolean).forEach(nm=>{
      const id=byName(nm); if(id) l.camp.items[id]={s:2,q:1}; });
    g("other").split(";").map(x=>x.trim()).filter(Boolean).forEach(x=>l.camp.extra.push(x));
    const num=v=>v===""?null:(isNaN(+v)?v:+v);
    l.temp=g("temp_c")===""?null:parseFloat(g("temp_c"));
    l.wx=g("conditions").split(";").map(x=>x.trim()).filter(Boolean);
    l.gut=num(g("gut")); l.mood=num(g("mood")); l.legs=num(g("legs"));
    l.layers=g("layers")||null; l.toilet=g("toilet")||"None"; l.swell=g("swelling")||null;
    l.symptoms=g("symptoms").split(";").map(x=>x.trim()).filter(Boolean);
    l.symOther=g("symptom_other")||"";
    l.newOnsets=g("new_onsets").split(";").map(x=>x.trim()).filter(Boolean);
    l.maint=g("maintenance").split(";").map(x=>x.trim()).filter(Boolean);
    l.notes=g("notes"); l.synced=true;
    l.newOnsets.forEach(s=>{ if(!onsets[s]) onsets[s]={lap:n,ts:l.arrived||now()}; });
    laps.push(l);
  });
  if(!laps.length) throw new Error("no lap rows found");
  laps.sort((a,b)=>a.n-b.n);
  S.laps=laps; S.onsets=onsets; S.cur=null; S.editN=null;
  S.nextLap=laps[laps.length-1].n+1;
  if(!S.raceStart && laps[0].arrived){
    const d=new Date(laps[0].arrived); d.setMinutes(0,0,0); S.raceStart=d.getTime();
  }
  save(); return laps.length;
}

/* ---------- backup ---------- */
async function opfsWrite(t){ try{ if(!navigator.storage||!navigator.storage.getDirectory) return false;
  const d=await navigator.storage.getDirectory(); const f=await d.getFileHandle("lap-log.csv",{create:true});
  const w=await f.createWritable(); await w.write(t); await w.close(); return true; }catch(e){ return false; } }
async function opfsRead(){ try{ const d=await navigator.storage.getDirectory();
  const f=await d.getFileHandle("lap-log.csv"); return await (await f.getFile()).text(); }catch(e){ return null; } }
function downloadCSV(name){ try{
  const b=new Blob([buildCSV()],{type:"text/csv"}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.style.display="none";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},4000); return true;
}catch(e){ return false; } }
async function snapshot(lapN,manual){
  const csv=buildCSV(); const okO=await opfsWrite(csv);
  let okD=false; const every=S.settings.snapEvery||1;
  if(manual||lapN==null||lapN%every===0) okD=downloadCSV(`lap-log-${String(lapN??"manual").padStart(2,"0")}.csv`);
  S.lastBackup={ts:now(),lap:lapN,opfs:okO,file:okD}; save();
  if(manual) toast(okD?"Backup saved to Downloads":"Saved to device store only");
}
/* pull the whole record back down from the sheet */
async function fetchFromSheet(){
  if(!S.settings.syncUrl) throw new Error("No sheet URL set");
  const url=S.settings.syncUrl+(S.settings.syncUrl.includes("?")?"&":"?")
    +"get=csv&secret="+encodeURIComponent(S.settings.syncSecret||"");
  const res=await fetch(url,{method:"GET",redirect:"follow"});
  const txt=(await res.text()).trim();
  if(/^ERR/i.test(txt)) throw new Error(txt.slice(0,120));
  if(/<html/i.test(txt)) throw new Error("Google returned HTML. Redeploy with access set to Anyone.");
  if(txt.indexOf("lap,")!==0) throw new Error("Sheet didn't return a lap CSV. Update the Apps Script — it needs the doGet in Setup.");
  return txt;
}

<pre>var SECRET = 'CHANGE_ME';

function doGet(e){
  var p = (e &amp;&amp; e.parameter) || {};
  if (String(p.secret) !== String(SECRET)) return reply('ERR: wrong secret');
  if (p.get !== 'csv') return reply('OK:0');
  var sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('laps');
  if (!sh || sh.getLastRow() === 0) return reply('ERR: no data');
  var v = sh.getDataRange().getValues();
  return reply(v.map(function(r){
    return r.map(function(c){
      c = (c === null || c === undefined) ? '' : String(c);
      return /[",\n]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c;
    }).join(',');
  }).join('\n'));
}

function doPost(e){
  try {
    var d = JSON.parse(e.postData.contents);
    if (String(d.secret) !== String(SECRET)) return reply('ERR: wrong secret');
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var sh = ss.getSheetByName('laps') || ss.insertSheet('laps');
    if (sh.getLastRow() === 0) sh.appendRow(d.cols);
    var ids = sh.getRange(1,1,sh.getLastRow(),1).getValues()
                .map(function(x){ return String(x[0]); });
    d.rows.forEach(function(r){
      var f = ids.indexOf(String(r[0]));
      if (f &gt; 0) sh.getRange(f+1,1,1,r.length).setValues([r]);
      else { sh.appendRow(r); ids.push(String(r[0])); }
    });
    SpreadsheetApp.flush();
    return reply('OK:' + d.rows.length);
  } catch (err) { return reply('ERR: ' + err); }
}

function reply(t){
  return ContentService.createTextOutput(t)
    .setMimeType(ContentService.MimeType.TEXT);
}</pre>
      <p class="hint">Replace the whole script, then <b>Deploy → New deployment</b>. The old one has no doGet, so "From the sheet" won't work until you do.</p>
    </details>
  </section>`;
}

/* ============================================================
   EVENTS
   ============================================================ */
function setArrival(l,val){
  if(!val){ l.arrived=null; return; }
  const [h,m,sec]=val.split(":").map(Number);
  const anchor=whistle(l.n)||l.arrived||now();
  const d=new Date(anchor); d.setHours(h,m,sec||0,0);
  let ts=d.getTime();
  const w=whistle(l.n);
  if(w && ts<w) ts+=864e5;              // rolled past midnight
  l.arrived=ts;
}

function bind(){
  const on=(s,e,f)=>{ const el=$(s); if(el) el.addEventListener(e,f); };
  const L=activeLap();

  on("#btnStart","click",()=>{
    S.startPending=true; S.startDraft=defaultStartTs(); save(); render();
  });
  on("#cancelStart","click",()=>{ S.startPending=false; save(); render(); });
  on("#tStart","change",e=>{
    const v=e.target.value; if(!v) return;
    const [h,m,sec]=v.split(":").map(Number);
    const d=new Date(S.startDraft||now()); d.setHours(h,m,sec||0,0);
    S.startDraft=d.getTime(); save(); render();
  });
  on("#confirmStart","click",()=>{
    S.raceStart=S.startDraft||defaultStartTs();
    S.startPending=false; S.startDraft=null; S.nextLap=1; S.raceEnd=null;
    save(); render(); tickClock();
    toast("Bell 1 at "+hhmm(S.raceStart)+" — every lap on the hour from here");
  });
  on("#btnIn","click",()=>{
    const l=blankLap(S.nextLap);
    const nextBell=whistle(l.n+1);
    // If the next bell has already gone, she left before this got opened —
    // stamping now() would record a false arrival. Leave it blank instead.
    l.arrived = (nextBell && now()>nextBell) ? null : now();
    S.cur=l; save(); render(); tickClock();
    if(l.arrived==null) toast("Logging after the bell — enter her arrival time");
  });
  on("#undoIn","click",()=>{ if(confirm("Discard this hour's capture?")){ S.cur=null; save(); render(); } });

  const submit=()=>{
    const l=S.cur; if(!l) return;
    if(!l.arrived) l.arrived=now();
    S.laps.push(l); S.nextLap=l.n+1; S.cur=null;
    save(); snapshot(l.n,false); queueSync(); render();
    toast(`Hour ${l.n} submitted · ${mmss(campMs(l))} to the bell`);
  };
  on("#btnSubmit","click",submit); on("#btnSubmit2","click",submit);
  on("#btnNext","click",()=>{
    const n=S.cur?S.cur.n:0;
    submit();
    const l=blankLap(n+1);
    const nb=whistle(l.n+1);
    l.arrived=(nb && now()>nb)?null:now();
    S.cur=l; save(); render(); tickClock();
    toast(`Hour ${n} submitted — now logging hour ${l.n}`);
  });

  const doneEdit=()=>{ const l=activeLap(); if(l) l.synced=false;
    S.editN=null; S.tab="log"; save(); snapshot(null,false); queueSync(); render(); toast("Hour updated"); };
  on("#doneEdit","click",doneEdit); on("#doneEdit2","click",doneEdit);
  on("#delLap","click",()=>{ const n=S.editN;
    if(!confirm(`Delete hour ${n} completely?`)) return;
    S.laps=S.laps.filter(l=>l.n!==n); S.editN=null; S.tab="log"; save(); render(); toast("Hour "+n+" deleted"); });

  on("#btnEnd","click",()=>{
    if(S.cur && !confirm("An hour is open and unsubmitted. End the race anyway?")) return;
    S.endPending=true; S.endDraft=now(); S.endNoteDraft=S.endNote||""; save(); render();
  });
  on("#cancelEnd","click",()=>{ S.endPending=false; save(); render(); });
  on("#tEnd","change",e=>{
    const v=e.target.value; if(!v) return;
    const [h,m,sec]=v.split(":").map(Number);
    const d=new Date(S.endDraft||now()); d.setHours(h,m,sec||0,0);
    let ts=d.getTime();
    if(S.raceStart && ts<S.raceStart) ts+=864e5;   // ran past midnight
    S.endDraft=ts; save(); render();
  });
  on("#endNote","input",e=>{ S.endNoteDraft=e.target.value; save(); });
  on("#confirmEnd","click",()=>{
    S.raceEnd=S.endDraft||now(); S.endNote=S.endNoteDraft||"";
    S.endPending=false; S.endDraft=null; S.endNoteDraft=""; S.cur=null;
    save(); snapshot(null,true); queueSync(); render(); stopAllClocks();
    toast("Race ended "+hhmmss(S.raceEnd)+" — data backed up");
  });
  on("#btnReopen","click",()=>{ if(!confirm("Reopen the race and keep logging?")) return;
    S.raceEnd=null; save(); render(); });
  on("#btnGoExport","click",()=>{ S.tab="out"; save(); render(); });

  if(L){
    on("#tIn","change",e=>{ setArrival(L,e.target.value); save(); render(); });
    on("#tIn","input",e=>{ const v=e.target.value;
      if(v&&(v.length===5||v.length===8)){ setArrival(L,v); save(); } });

    document.querySelectorAll("[data-drink]").forEach(b=>b.addEventListener("click",()=>{
      const sec=L[b.dataset.drink], id=b.dataset.id;
      sec.drink=(sec.drink===id)?null:id; save(); render(); }));
    document.querySelectorAll("[data-amt]").forEach(b=>b.addEventListener("click",()=>{
      L[b.dataset.amt].amt=b.dataset.k; save(); render(); }));
    document.querySelectorAll("[data-item]").forEach(b=>b.addEventListener("click",()=>{
      const w=b.dataset.item, id=b.dataset.id, sec=L[w];
      const e=sec.items[id], cur=e?e.s:0, next=(cur+1)%3;
      if(next===0) delete sec.items[id];
      else sec.items[id]={s:next,q:(e&&e.q!=null)?e.q:plannedQty(L.n,id)};
      save(); render(); }));
    document.querySelectorAll("[data-portion]").forEach(b=>b.addEventListener("click",()=>{
      const sec=L[b.dataset.portion], id=b.dataset.id;
      if(sec.items[id]) sec.items[id].q=parseFloat(b.dataset.q); save(); render(); }));
    document.querySelectorAll("[data-extra]").forEach(b=>b.addEventListener("click",()=>{
      L[b.dataset.extra].extra.splice(+b.dataset.i,1); save(); render(); }));
    document.querySelectorAll("[data-extraadd]").forEach(b=>b.addEventListener("click",()=>{
      const w=b.dataset.extraadd, inp=$("#extraIn_"+w), v=inp?inp.value.trim():"";
      if(!v) return; L[w].extra.push(v); save(); render(); }));

    document.querySelectorAll("[data-rate]").forEach(b=>b.addEventListener("click",()=>{
      const f=b.dataset.rate, raw=b.dataset.v, v=isNaN(+raw)?raw:+raw;
      L[f]=(L[f]===v)?null:v; save(); render(); }));
    document.querySelectorAll("[data-sym]").forEach(b=>b.addEventListener("click",()=>{
      const s=b.dataset.sym, i=L.symptoms.indexOf(s);
      if(i>=0){ L.symptoms.splice(i,1);
        const j=L.newOnsets.indexOf(s); if(j>=0){ L.newOnsets.splice(j,1); delete S.onsets[s]; } }
      else{ L.symptoms.push(s);
        if(!S.onsets[s]){ S.onsets[s]={lap:L.n,ts:L.arrived||now()}; L.newOnsets.push(s);
          toast(`First ${s.toLowerCase()} — hour ${L.n}`); } }
      save(); render(); }));
    on("#symOther","input",e=>{ L.symOther=e.target.value; save(); });
    document.querySelectorAll("[data-toilet]").forEach(b=>b.addEventListener("click",()=>{
      L.toilet=b.dataset.toilet; save(); render(); }));
    document.querySelectorAll("[data-maint]").forEach(b=>b.addEventListener("click",()=>{
      const m=b.dataset.maint, i=L.maint.indexOf(m);
      if(i>=0) L.maint.splice(i,1); else L.maint.push(m); save(); render(); }));
    document.querySelectorAll("[data-swell]").forEach(b=>b.addEventListener("click",()=>{
      L.swell=b.dataset.swell; save(); render(); if(b.dataset.swell==="yes") showFlags(true); }));
    on("#temp","input",e=>{ const v=e.target.value; L.temp=(v===""?null:parseFloat(v)); save(); });
    document.querySelectorAll("[data-wx]").forEach(b=>b.addEventListener("click",()=>{
      L.wx=L.wx||[]; const w=b.dataset.wx, i=L.wx.indexOf(w);
      if(i>=0) L.wx.splice(i,1); else L.wx.push(w); save(); render(); }));
    on("#notes","input",e=>{ L.notes=e.target.value; save(); });
  }

  on("#btnFlags","click",()=>showFlags(false));
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{
    S.editN=+b.dataset.open; S.tab="lap"; save(); render(); toast("Editing hour "+S.editN); }));

  on("#dl","click",()=>downloadCSV(`lap-log-${new Date().toISOString().slice(0,10)}.csv`));
  on("#cp","click",async()=>{ try{ await navigator.clipboard.writeText(buildCSV()); toast("CSV copied"); }
    catch(e){ $("#csvBox").select(); toast("Select and copy from the box"); } });
  on("#shareBtn","click",async()=>{ try{
      const f=new File([buildCSV()],"lap-log.csv",{type:"text/csv"});
      if(navigator.canShare&&navigator.canShare({files:[f]})) await navigator.share({files:[f],title:"Lap log"});
      else await navigator.share({text:buildCSV(),title:"Lap log"});
    }catch(e){ toast("Sharing unavailable — use Download"); } });
  on("#syncNow","click",()=>queueSync(true));
  on("#backupNow","click",()=>snapshot(S.laps.length?S.laps[S.laps.length-1].n:0,true));

  const doRecover=(txt,label)=>{
    const out=$("#recMsg");
    if(!confirm(`Replace everything in this app with ${label}?`)) return;
    try{ const n=importCSV(txt); render(); toast(n+" hours recovered"); }
    catch(e){ out.innerHTML=`<div class="err">${String(e.message)}</div>`; }
  };
  on("#recSheet","click",async()=>{
    const out=$("#recMsg"); out.innerHTML=`<p class="hint">Downloading from the sheet…</p>`;
    try{ const txt=await fetchFromSheet(); doRecover(txt,"the copy in the sheet"); }
    catch(e){ out.innerHTML=`<div class="err">${String(e.message||e).replace(/</g,"&lt;")}</div>`; }
  });
  on("#recOpfs","click",async()=>{
    const out=$("#recMsg"); const txt=await opfsRead();
    if(!txt){ out.innerHTML=`<div class="err">Nothing in the device store.</div>`; return; }
    doRecover(txt,"the device store copy");
  });
  on("#recFile","click",()=>$("#fileIn").click());
  on("#fileIn","change",async e=>{ const f=e.target.files[0]; if(!f) return;
    try{ doRecover(await f.text(),f.name); }
    catch(err){ $("#recMsg").innerHTML=`<div class="err">${String(err.message)}</div>`; } });

  on("#wipe","click",()=>{
    if(!confirm("Erase every hour? This cannot be undone.")) return;
    if(!confirm("Really erase? Export first if you haven't.")) return;
    S.laps=[]; S.cur=null; S.editN=null; S.onsets={}; S.nextLap=1;

    const u=$("#sUrl").value.trim(), sec=$("#sSec").value.trim();
    if(!u){ $("#syncMsg").innerHTML=`<div class="err">Set the URL first.</div>`; return; }
    const link=location.origin+location.pathname+"?u="+encodeURIComponent(u)+(sec?"&s="+encodeURIComponent(sec):"");
    try{ await navigator.clipboard.writeText(link); toast("Setup link copied"); }catch(e){}
    $("#syncMsg").innerHTML=`<div class="warn">Opening this on another phone sets up sync. It carries the secret — send it somewhere private.</div>
      <textarea readonly style="min-height:70px;font-size:11px" onclick="this.select()">${link.replace(/</g,"&lt;")}</textarea>`; });
  on("#testSync","click",async()=>{
    S.settings.syncUrl=$("#sUrl").value.trim(); S.settings.syncSecret=$("#sSec").value.trim(); save();
    const out=$("#syncMsg");
    if(!S.settings.syncUrl){ out.innerHTML=`<div class="err">No URL.</div>`; return; }
    out.innerHTML=`<p class="hint">Testing…</p>`;
    try{
      const {res,txt,bytes}=await postToSheet(S.settings.syncUrl,S.settings.syncSecret,COLS,[]);
      S.lastSync=`${res.status} · ${bytes}B · ${txt.slice(0,120)}`;
      let v;
      if(txt.indexOf("OK:")===0) v=`<div class="warn" style="color:var(--green);border-color:var(--green)">Working.</div>`;
      else if(/<html/i.test(txt)) v=`<div class="err">Google returned HTML. Redeploy with access set to <b>Anyone</b>.</div>`;
      else if(/wrong secret/i.test(txt)) v=`<div class="err">Wrong secret.</div>`;
      else v=`<div class="err">Unexpected reply — probably an old deployment.</div>`;
      out.innerHTML=v+`<p class="hint">HTTP ${res.status} · ${bytes} bytes · <span class="mono">${txt.replace(/</g,"&lt;").slice(0,140)}</span></p>`;
      S.syncErr=""; save();
    }catch(err){ out.innerHTML=`<div class="err">Couldn't reach it: ${String(err.message||err).replace(/</g,"&lt;")}</div>`; } });
  on("#updChk","click",async()=>{
    const out=$("#updMsg");
    if(S.cur||S.laps.length){ if(!confirm("A race is in progress. Continue?")) return; }
    out.innerHTML=`<p class="hint">Checking…</p>`;
    try{ if(!swReg){ out.innerHTML=`<div class="err">No service worker.</div>`; return; }
      await swReg.update();
      if(swReg.waiting){ out.innerHTML=`<div class="warn">New version ready. <b>Reload twice.</b></div>`;
        swReg.waiting.postMessage({type:"SKIP_WAITING"}); }
      else out.innerHTML=`<p class="hint">Already on ${APP_VERSION}.</p>`;
    }catch(e){ out.innerHTML=`<div class="err">Couldn't check — probably offline.</div>`; } });
}

document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
  if(S.editN!=null&&b.dataset.tab!=="lap") S.editN=null;
  S.tab=b.dataset.tab; save(); render(); tickClock();
}));

/* clock: counts down to the next bell while logging, counts up on course */
let clockTimer=null;
function stopAllClocks(){ clearInterval(clockTimer); clockTimer=null; }
function tickClock(){
  clearInterval(clockTimer); clockTimer=null;
  if(S.tab!=="lap"||S.editN!=null||S.raceEnd) return;
  clockTimer=setInterval(paintClock,1000); paintClock();
}
function paintClock(){
  const el=$("#ct"); if(!el){ clearInterval(clockTimer); return; }
  if(S.cur){
    const b=whistle(S.cur.n+1);
    const lbl=$("#clbl");
    if(b){ const left=b-now();
      if(left>=0){
        el.textContent=mmss(left);
        el.style.color = left<120000 ? "var(--red)" : "";
        if(lbl) lbl.textContent="Until the bell";
      } else {
        el.textContent=mmss(now()-b);
        el.style.color="";
        if(lbl) lbl.textContent="She's been out";
      }
    } else el.textContent=mmss(now()-(S.cur.arrived||now()));
  } else if(S.raceStart){
    el.textContent=mmss(now()-whistle(S.nextLap));
  }
}
const startClock=tickClock;

function showFlags(fromSwelling){
  const d=document.createElement("div"); d.className="scrim";
  d.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <h3>${fromSwelling?"Swelling logged — read this":"Stop and get medical help"}</h3>
    ${fromSwelling?`<p style="font-size:15px">Swollen hands or fingers alongside a lot of fluid is a hyponatremia sign. <b>Stop plain water now</b> and go to race medical. Don't work around it with the plan.</p>`:""}
    <ul>
      <li>Swollen hands or fingers, or weight gain during the race</li>
      <li>Confusion, or a headache with high fluid intake</li>
      <li>Chest pain</li>
      <li>No urination for more than 8 hours</li>
      <li>Dark cola-coloured urine</li>
      <li>Repeated vomiting with nothing staying down</li>
    </ul>
    <p style="font-size:14px;color:var(--muted);margin-top:12px">Any of these: race medical, not a plan tweak.</p>
    <button class="big wide" id="closeFlags" style="width:100%;margin-top:14px">Close</button>
  </div>`;
  document.body.appendChild(d);
  d.querySelector("#closeFlags").addEventListener("click",()=>d.remove());
  d.addEventListener("click",e=>{ if(e.target===d) d.remove(); });
}

/* ---------- sync ---------- */
function syncBadge(txt,cls){
  const b=$("#bSync"); if(!b) return;
  if(!S.settings.syncUrl){ b.textContent="sync off"; b.className="badge"; return; }
  const q=S.laps.filter(l=>!l.synced).length;
  b.textContent=txt||(q?q+" queued":"synced");
  b.className="badge "+(cls||(q?"":"on"));
}
async function postToSheet(url,secret,cols,rows){
  const body=JSON.stringify({secret,cols,rows});
  const res=await fetch(url,{method:"POST",redirect:"follow",
    headers:{"Content-Type":"text/plain;charset=utf-8"},body});
  const txt=(await res.text()).trim();
  return {res,txt,bytes:body.length};
}
let syncing=false;
async function queueSync(manual){
  if(!S.settings.syncUrl){ if(manual) toast("No sheet URL set"); syncBadge(); return; }
  const pending=S.laps.filter(l=>!l.synced);
  if(!pending.length){ syncBadge(); if(manual) toast("Nothing waiting"); return; }
  if(syncing) return;
  syncing=true; syncBadge("sending…");
  try{
    const all=buildCSV().split("\n"), cols=all[0].split(",");
    const sorted=[...S.laps].sort((a,b)=>a.n-b.n);
    const rowFor=l=>parseCSVLine(all[sorted.indexOf(l)+1]);
    const BATCH=10; let done=0,lastBytes=0;
    for(let i=0;i<pending.length;i+=BATCH){
      const slice=pending.slice(i,i+BATCH).map(rowFor);
      const {res,txt,bytes}=await postToSheet(S.settings.syncUrl,S.settings.syncSecret,cols,slice);
      lastBytes=bytes; S.lastSync=`${res.status} · ${bytes}B · ${txt.slice(0,120)}`;
      if(!res.ok) throw new Error(`HTTP ${res.status} on a ${bytes}-byte send (${slice.length} rows)`);
      if(txt.indexOf("OK:")!==0) throw new Error(/<html/i.test(txt)
        ? "Google sent HTML, not the script's reply. Redeploy with access set to Anyone."
        : "Sheet rejected it: "+(txt.slice(0,80)||"empty reply"));
      pending.slice(i,i+BATCH).forEach(l=>l.synced=true);
      done+=slice.length; save(); syncBadge();
    }
    S.syncErr=""; save(); syncBadge();
    if(manual) toast(`Sheet confirmed ${done} row(s) · ${lastBytes}B`);
  }catch(e){
    S.syncErr=String(e.message||e); save();
    syncBadge(navigator.onLine?"rejected":"offline","off");
    if(manual) toast(S.syncErr.slice(0,90));
  }finally{ syncing=false; }
}
setInterval(()=>{ if(navigator.onLine) queueSync(false); },90000);
window.addEventListener("online",()=>queueSync(false));
window.addEventListener("beforeunload",e=>{ if(S.cur){ e.preventDefault(); e.returnValue=""; } });

/* ---------- provisioning link ---------- */
(function provision(){ try{
  const q=new URLSearchParams(location.search);
  const u=q.get("u"), sec=q.get("s");
  if(!u&&!sec) return;
  if(u) S.settings.syncUrl=decodeURIComponent(u);
  if(sec) S.settings.syncSecret=decodeURIComponent(sec);
  lsSave(S); idbSave(S);
  history.replaceState(null,"",location.pathname);
  S.provisioned=[u?"sheet URL":null,sec?"secret":null].filter(Boolean).join(", ");
}catch(e){} })();

/* ---------- boot ---------- */
applyTheme();
persistOK=lsSave(S);
render();
if(S.provisioned){ toast("Set up from link: "+S.provisioned); delete S.provisioned; save(); }
tickClock();
syncBadge();
(function(){ const b=$("#bSave"); if(b){ b.textContent=persistOK?"saved":"no storage"; b.className="badge "+(persistOK?"on":"off"); } })();
</script>
