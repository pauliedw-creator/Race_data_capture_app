<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12100E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Lap Log — Backyard Crew</title>
<style>
:root, [data-theme="dark"]{
  --bg:#12100E;
  --panel:#1C1917;
  --panel-2:#262220;
  --line:#332E2A;
  --amber:#FFB000;
  --amber-dim:#C98A18;
  --text:#EDE6DC;
  --muted:#8A8078;
  --green:#6FCF7F;
  --red:#E0574A;
  --blue:#7FB2E0;
  --on-amber:#1A1206;
  --on-blue:#0A1520;
  --sel-bg:#2A2008;
  --alert-bg:#2A1614;
  --alert-line:#4A2E2A;
  --ok-line:#2E4A34;
  --plan-line:#4A4038;
  --shadow:none;
  --r:10px;
  --tap:56px;
}
[data-theme="light"]{
  --bg:#F5F2EC;
  --panel:#FFFFFF;
  --panel-2:#F0EBE2;
  --line:#DED6C8;
  --amber:#A85406;
  --amber-dim:#8A4405;
  --text:#1F1B16;
  --muted:#6B6259;
  --green:#15803D;
  --red:#B3261E;
  --blue:#1D4ED8;
  --on-amber:#FFFFFF;
  --on-blue:#FFFFFF;
  --sel-bg:#FBEEDB;
  --alert-bg:#FBE6E4;
  --alert-line:#E2B4AF;
  --ok-line:#B4D9C0;
  --plan-line:#C6BBAA;
  --shadow:0 1px 2px rgba(31,27,22,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:16px;line-height:1.35;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:.02em}
.eyebrow{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin:0 0 8px
}
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
  display:flex;align-items:baseline;gap:10px;justify-content:space-between
}
header .lapno{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
header .lapno b{color:var(--amber);font-size:20px;letter-spacing:0}
.badge{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.on{color:var(--green);border-color:var(--ok-line)}
.badge.off{color:var(--red);border-color:var(--alert-line)}
main{padding:14px 14px 20px;max-width:640px;margin:0 auto}
section{margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}

/* ---- hero: the downtime clock ---- */
.clock{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 14px 14px;text-align:center;position:relative;overflow:hidden
}
.clock.live{border-color:var(--amber-dim)}
.clock .t{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:clamp(52px,19vw,76px);line-height:.92;letter-spacing:-.02em;
  color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums
}
.clock.live .t{color:var(--amber)}
.clock .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.clock .sub{font-size:12px;color:var(--muted);margin-top:2px}
.pulse{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--amber);opacity:0}
.clock.live .pulse{opacity:1;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.clock.live .pulse{animation:none}}

.bigrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.big{
  min-height:64px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel-2);font-size:15px;font-weight:650;
  letter-spacing:.1em;text-transform:uppercase
}
.big:active{transform:translateY(1px)}
.big.primary{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}
.big.ghost{color:var(--muted)}
.big[disabled]{opacity:.32}
.big.wide{grid-column:1 / -1}

/* ---- chips ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:var(--tap);padding:8px 14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);
  font-size:15px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  flex:1 1 auto;min-width:calc(50% - 4px)
}
.chip .sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.chip[data-s="1"]{border-color:var(--amber);background:var(--sel-bg);color:var(--amber)}
.chip[data-s="1"] .sub{color:var(--amber-dim)}
.chip[data-s="2"]{border-color:var(--alert-line);background:var(--alert-bg);color:var(--red);text-decoration:line-through}
.chip[data-s="2"] .sub{color:var(--red);text-decoration:none}
.chip.planned:not([data-s="1"]):not([data-s="2"]){border-style:dashed;border-color:var(--plan-line)}
.legend{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.02em}

/* ---- segmented ---- */
.seg{display:grid;gap:6px;grid-auto-flow:column;grid-auto-columns:1fr}
.seg button{
  min-height:var(--tap);border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel-2);font-size:15px;font-weight:600
}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}
.seg.sm button{min-height:46px;font-size:14px}
.seg.tone button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.carry{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);float:right;font-weight:600}

/* ---- symptoms ---- */
.sym{display:flex;flex-wrap:wrap;gap:8px}
.sym button{
  min-height:50px;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel-2);font-size:14px;flex:1 1 auto;min-width:calc(33% - 6px)
}
.sym button[aria-pressed="true"]{background:var(--alert-bg);border-color:var(--red);color:var(--red);font-weight:650}
.sym button .new{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}

textarea,input[type=text],input[type=time],input[type=number],input[type=url]{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
  color:var(--text);padding:12px;font:inherit
}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:600}

/* ---- nav ---- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}
nav button{padding:12px 4px 10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
nav button[aria-current="true"]{color:var(--amber);box-shadow:inset 0 2px 0 var(--amber)}
nav button .n{display:block;font-size:17px;margin-bottom:3px;font-weight:500}

/* ---- log list ---- */
.laprow{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.laprow .n{font-size:19px;color:var(--amber);min-width:34px}
.laprow .m{flex:1;min-width:0}
.laprow .m .a{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.laprow .m .b{font-size:11px;color:var(--muted);margin-top:2px}
.laprow .d{font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* ---- modal ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--panel);border:1px solid var(--red);border-radius:var(--r);padding:18px;max-width:420px;width:100%;max-height:86vh;overflow:auto}
.modal h3{color:var(--red);margin-bottom:10px}
.modal ul{margin:10px 0 0;padding-left:18px}
.modal li{margin-bottom:8px;font-size:15px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));
  background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:10px 18px;
  font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none
}
.toast.show{opacity:1}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.warn{border-left:3px solid var(--amber);padding-left:10px;color:var(--amber-dim);font-size:13px;margin:10px 0}
.err{border-left:3px solid var(--red);padding-left:10px;color:var(--red);font-size:13px;margin:10px 0}
hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:none}
.kv b{color:var(--amber);font-weight:600}
details{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:10px 0}
summary{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;cursor:pointer}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:11px;color:var(--muted)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>

<header>
  <div class="lapno">Lap <b id="hLap">1</b> <span id="hOf" style="color:var(--muted)">/ 48</span></div>
  <div style="display:flex;gap:6px">
    <span class="badge" id="bSave">saving…</span>
    <span class="badge" id="bSync">sync off</span>
  </div>
</header>

<main id="view"></main>

<nav>
  <button data-tab="lap"  aria-current="true"><span class="n">◉</span>Lap</button>
  <button data-tab="log"><span class="n">≡</span>Log</button>
  <button data-tab="out"><span class="n">↥</span>Export</button>
  <button data-tab="set"><span class="n">⚙</span>Setup</button>
</nav>

<div class="toast" id="toast"></div>

<script>
"use strict";
const APP_VERSION = "1.2.0";

function applyTheme(){
  const pick = (S && S.settings && S.settings.theme) || "dark";
  const eff = pick==="auto"
    ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
    : pick;
  document.documentElement.setAttribute("data-theme", eff);
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", eff==="light" ? "#F5F2EC" : "#12100E");
}
try{
  window.matchMedia("(prefers-color-scheme: light)")
    .addEventListener("change",()=>{ if(S.settings.theme==="auto") applyTheme(); });
}catch(e){}

/* Ask the browser never to evict our data. Android Chrome grants this
   for installed apps. Failure is non-fatal. */
(async()=>{ try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(e){} })();

/* Service worker: cache-first, pinned. It will NOT update itself mid-race —
   updating is a deliberate act on the Setup tab. */
let swReg=null;
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"})
    .then(r=>{ swReg=r; })
    .catch(()=>{});
}

/* ============================================================
   STORAGE — localStorage primary, IndexedDB mirror, both optional.
   Nothing here is allowed to throw. If both fail the app still
   runs in memory and the Export tab is the record.
   ============================================================ */
const KEY = "backyard-lap-log-v1";
let persistOK = false;

function lsSave(obj){
  try{ localStorage.setItem(KEY, JSON.stringify(obj)); return true; }
  catch(e){ return false; }
}
function lsLoad(){
  try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }
  catch(e){ return null; }
}
let idb=null;
(function openIDB(){
  try{
    const rq = indexedDB.open("backyardLapLog",1);
    rq.onupgradeneeded = e => { e.target.result.createObjectStore("kv"); };
    rq.onsuccess = e => { idb = e.target.result; };
    rq.onerror = () => { idb=null; };
  }catch(e){ idb=null; }
})();
function idbSave(obj){
  try{
    if(!idb) return;
    const tx = idb.transaction("kv","readwrite");
    tx.objectStore("kv").put(JSON.stringify(obj), KEY);
  }catch(e){}
}

/* ============================================================
   PRODUCT LIBRARY
   Values traced to the project product library. Anything the
   library does not state is marked est:true and flagged on export
   so estimated numbers never pass silently into the record.
   ============================================================ */
const DEFAULT_PRODUCTS = [
  // drinks (fluid-bearing) --------------------------------------------------
  {id:"tailwind",   name:"Tailwind",        note:"2 scoops / 500ml",  kcal:200, carb:50, na:600, caf:0,  ml:500, drink:true},
  {id:"tailwindC",  name:"Tailwind caff",   note:"2 scoops / 500ml",  kcal:200, carb:50, na:600, caf:70, ml:500, drink:true},
  {id:"skratch",    name:"Skratch",         note:"1 scoop / 500ml",   kcal:80,  carb:21, na:380, caf:0,  ml:500, drink:true},
  {id:"barefuel",   name:"BareFuel",        note:"VALUES NOT SET",    kcal:0,   carb:0,  na:0,   caf:0,  ml:500, drink:true, unset:true},
  {id:"water",      name:"Water",           note:"500ml",             kcal:0,   carb:0,  na:0,   caf:0,  ml:500, drink:true},
  {id:"coke",       name:"Coke",            note:"200ml",             kcal:84,  carb:21, na:20,  caf:19, ml:200, drink:true},
  // solids ------------------------------------------------------------------
  {id:"gel",        name:"Gel",             note:"Active Root",       kcal:124, carb:30, na:40,  caf:0,  ml:0},
  {id:"digestive",  name:"Choc digestives", note:"x2",                kcal:170, carb:22, na:90,  caf:0,  ml:0},
  {id:"banana",     name:"Banana",          note:"",                  kcal:105, carb:27, na:1,   caf:0,  ml:0},
  {id:"muller",     name:"Müller Rice",     note:"lap 6 only",        kcal:180, carb:30, na:150, caf:0,  ml:0, est:true},
  {id:"kendal",     name:"Kendal mint",     note:"half bar 20g",      kcal:80,  carb:17, na:0,   caf:0,  ml:0, est:true},
  {id:"turkish",    name:"Turkish delight", note:"3 cubes",           kcal:88,  carb:22, na:0,   caf:0,  ml:0, est:true},
  {id:"richtea",    name:"Rich tea",        note:"x2",                kcal:86,  carb:12, na:0,   caf:0,  ml:0},
  {id:"soup",       name:"Soup + bread",    note:"camp",              kcal:150, carb:16, na:500, caf:0,  ml:150, est:true},
  {id:"chew",       name:"Caffeine chew",   note:"Brain Bullet 80mg", kcal:0,   carb:0,  na:0,   caf:80, ml:0}
];

const AMOUNTS = [
  {k:"none", label:"None",  f:0},
  {k:"lit",  label:"Little",f:.25},
  {k:"half", label:"Half",  f:.5},
  {k:"most", label:"Most",  f:.75},
  {k:"all",  label:"All",   f:1}
];
const SYMPTOMS = ["Bloating","Urgency","Nausea","Stomach cramp","Muscle cramp","Heat","Cold","Dizzy","Sleepy"];
const TOILET   = ["None","Wee","BM","Urgent BM"];
const MAINT    = ["Lube","Feet","Socks","Charge"];

/* ============================================================
   STATE
   ============================================================ */
const BLANK_SETTINGS = {
  raceName:"Rasselbock Backyard — Hardwick Hall",
  startTime:"", targetLaps:48, lapMiles:4.161,
  syncUrl:"", syncSecret:"", planText:"", snapEvery:1, theme:"dark"
};
let S = lsLoad() || {
  settings:{...BLANK_SETTINGS},
  products:DEFAULT_PRODUCTS,
  laps:[],
  cur:null,          // lap in progress in camp: {n, arrived, ...}
  onsets:{},         // symptom -> {lap, ts}
  nextLap:1,
  tab:"lap"
};
// forward-compat: fill any missing keys
S.settings = {...BLANK_SETTINGS, ...(S.settings||{})};
S.products = S.products && S.products.length ? S.products : DEFAULT_PRODUCTS;
S.laps = S.laps||[]; S.onsets = S.onsets||{}; S.nextLap = S.nextLap||1;

let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    const ok = lsSave(S);
    persistOK = ok;
    idbSave(S);
    const b = document.getElementById("bSave");
    b.textContent = ok ? "saved" : "no storage";
    b.className = "badge " + (ok ? "on" : "off");
  },120);
}

/* ============================================================
   PLAN — pasted from the workbook.  One line per lap:
     lap, drinkId, foodId, foodId, ...
   Unknown names are kept as free text so nothing is silently lost.
   ============================================================ */
function parsePlan(txt){
  const map={};
  (txt||"").split(/\n/).forEach(line=>{
    const parts = line.split(/[,|;]/).map(s=>s.trim()).filter(Boolean);
    if(parts.length<2) return;
    const n = parseInt(parts[0],10);
    if(!n) return;
    map[n] = parts.slice(1).map(resolveId).filter(Boolean);
  });
  return map;
}
function resolveId(token){
  const t = token.toLowerCase().replace(/[^a-z]/g,"");
  if(!t) return null;
  const p = S.products.find(p=>p.id.toLowerCase()===t)
        || S.products.find(p=>p.name.toLowerCase().replace(/[^a-z]/g,"")===t)
        || S.products.find(p=>p.name.toLowerCase().replace(/[^a-z]/g,"").startsWith(t) && t.length>3);
  return p ? p.id : null;
}
let PLAN = parsePlan(S.settings.planText);
function plannedFor(n){ return PLAN[n] || []; }

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s => document.querySelector(s);
const now = () => Date.now();
const hhmm = ts => ts ? new Date(ts).toTimeString().slice(0,5) : "";
const hhmmss = ts => ts ? new Date(ts).toTimeString().slice(0,8) : "";
function mmss(ms){
  if(ms<0) ms=0;
  const s = Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"),1800);
}
function prevLap(){ return S.laps.length ? S.laps[S.laps.length-1] : null; }
function carried(field, fallback){
  const p = prevLap();
  return (p && p[field]!=null && p[field]!=="") ? p[field] : fallback;
}
function prod(id){ return S.products.find(p=>p.id===id); }

function blankLap(n){
  return {
    n, arrived:null, departed:null,
    drink:null, drinkAmt:"all",
    items:{},          // id -> 1 taken | 2 refused
    extra:[],          // free-typed items {name}
    gut:null,
    mood:carried("mood",null), legs:carried("legs",null),
    urine:carried("urine",null), layers:carried("layers",null),
    toilet:"None", symptoms:[], maint:[], notes:"",
    newOnsets:[], synced:false
  };
}

/* totals from tapped chips + drink amount */
function totals(l){
  let t={kcal:0,carb:0,na:0,caf:0,ml:0,est:false,unset:false};
  if(l.drink){
    const p = prod(l.drink);
    const f = (AMOUNTS.find(a=>a.k===l.drinkAmt)||{f:1}).f;
    if(p){
      t.kcal+=p.kcal*f; t.carb+=p.carb*f; t.na+=p.na*f; t.caf+=p.caf*f; t.ml+=p.ml*f;
      if(p.est) t.est=true; if(p.unset) t.unset=true;
    }
  }
  Object.keys(l.items||{}).forEach(id=>{
    if(l.items[id]!==1) return;
    const p = prod(id); if(!p) return;
    t.kcal+=p.kcal; t.carb+=p.carb; t.na+=p.na; t.caf+=p.caf; t.ml+=p.ml;
    if(p.est) t.est=true; if(p.unset) t.unset=true;
  });
  if((l.extra||[]).length) t.est=true;
  return t;
}
function round(n){ return Math.round(n); }

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  document.querySelectorAll("nav button").forEach(b=>
    b.setAttribute("aria-current", b.dataset.tab===S.tab ? "true":"false"));
  const lapN = S.cur ? S.cur.n : S.nextLap;
  $("#hLap").textContent = lapN;
  $("#hOf").textContent = "/ " + S.settings.targetLaps;
  const v = $("#view");
  // Keep the page where the thumb left it. Only jump to the top when the
  // tab actually changes — re-rendering after a tap must not move anything.
  const y = window.scrollY;
  const tabChanged = (S.tab !== lastTab);
  const active = document.activeElement;
  const focusKey = active && active.id ? active.id : null;
  const caret = (active && "selectionStart" in active) ? active.selectionStart : null;

  v.innerHTML = ({lap:viewLap, log:viewLog, out:viewOut, set:viewSet})[S.tab]();
  bind();

  if(tabChanged){
    lastTab = S.tab;
    window.scrollTo(0,0);
  }else{
    window.scrollTo(0,y);
    if(focusKey){
      const el = document.getElementById(focusKey);
      if(el){
        el.focus({preventScroll:true});
        if(caret!=null && "setSelectionRange" in el){
          try{ el.setSelectionRange(caret,caret); }catch(e){}
        }
      }
    }
  }
}

function medianDown(){
  const d = S.laps.filter(l=>l.departed&&l.arrived).map(l=>l.departed-l.arrived).sort((a,b)=>a-b);

  return mmss(d[Math.floor(d.length/2)]);
}

/* ---------- EXPORT ---------- */
const COLS = ["lap","arrived","departed","downtime_min","drink","drink_amount","taken","refused","other",
  "kcal","carb_g","sodium_mg","fluid_ml","caffeine_mg","gut","mood","legs","urine","layers","toilet",
  "symptoms","new_onsets","maintenance","notes","flags"];
function csvCell(v){
  v = v==null ? "" : String(v);
  return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function buildCSV(){
  const lines = [COLS.join(",")];
  S.laps.forEach(l=>{
    const t = totals(l);
    const taken = Object.keys(l.items).filter(k=>l.items[k]===1).map(k=>(prod(k)||{}).name||k);
    const ref   = Object.keys(l.items).filter(k=>l.items[k]===2).map(k=>(prod(k)||{}).name||k);
    const flags = [t.est?"ESTIMATED_VALUES":"", t.unset?"UNSET_PRODUCT":"", l.swell==="yes"?"SWELLING":""].filter(Boolean).join(" ");
    lines.push([
      l.n, hhmmss(l.arrived), hhmmss(l.departed),
      l.departed&&l.arrived ? ((l.departed-l.arrived)/60000).toFixed(1) : "",
      l.drink?((prod(l.drink)||{}).name||l.drink):"", l.drink?l.drinkAmt:"",
      taken.join("; "), ref.join("; "), (l.extra||[]).join("; "),
      round(t.kcal), round(t.carb), round(t.na), round(t.ml), round(t.caf),
      l.gut??"", l.mood??"", l.legs??"", l.urine??"", l.layers??"", l.toilet||"",
      l.symptoms.join("; "), l.newOnsets.join("; "), l.maint.join("; "),
      (l.notes||"").replace(/\n/g," "), flags
    ].map(csvCell).join(","));
  });
  return lines.join("\n");
}

/* ============================================================
   BACKUP — four independent copies of the record:
     1. localStorage        2. IndexedDB
     3. OPFS file (silent, survives an app wipe less well than 4)
     4. CSV file in /Download (survives everything short of losing the phone)
   Plus 5. the Google Sheet when there is signal.
   Any one of them can rebuild the race.
   ============================================================ */
async function opfsWrite(text){
  try{
    if(!navigator.storage || !navigator.storage.getDirectory) return false;
    const dir = await navigator.storage.getDirectory();
    const fh  = await dir.getFileHandle("lap-log.csv",{create:true});
    const w   = await fh.createWritable();
    await w.write(text); await w.close();
    return true;
  }catch(e){ return false; }
}
async function opfsRead(){
  try{
    const dir = await navigator.storage.getDirectory();
    const fh  = await dir.getFileHandle("lap-log.csv");
    return await (await fh.getFile()).text();
  }catch(e){ return null; }
}
function downloadCSV(name){
  try{
    const blob=new Blob([buildCSV()],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=name; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },4000);
    return true;
  }catch(e){ return false; }
}
async function snapshot(lapN,manual){
  const csv=buildCSV();
  const okO=await opfsWrite(csv);
  let okD=false;
  const every=S.settings.snapEvery||1;
  if(manual || lapN===null || lapN%every===0){
    okD=downloadCSV(`lap-log-${String(lapN??"manual").padStart(2,"0")}.csv`);
  }
  S.lastBackup={ts:now(),lap:lapN,opfs:okO,file:okD};
  save();
  if(manual) toast(okD?"Backup saved to Downloads":"Saved to device store only");
}

/* rebuild the whole race from a CSV — the recovery path */
function importCSV(text){
  const rows=text.replace(/\r/g,"").split("\n").filter(r=>r.trim().length);
  if(!rows.length) throw new Error("empty file");
  const head=parseCSVLine(rows[0]);
  const ix=n=>head.indexOf(n);
  if(ix("lap")<0) throw new Error("no 'lap' column — is this a lap log CSV?");
  const byName=n=>{ const p=S.products.find(p=>p.name===n); return p?p.id:null; };
  const toTs=t=>{
    if(!t) return null;
    const d=new Date(); const [h,m,sec]=t.split(":").map(Number);
    d.setHours(h||0,m||0,sec||0,0); return d.getTime();
  };
  const laps=[], onsets={};
  rows.slice(1).forEach(r=>{
    const c=parseCSVLine(r);
    const g=n=>{ const i=ix(n); return i<0?"":c[i]; };
    const n=parseInt(g("lap"),10); if(!n) return;
    const l=blankLap(n);
    l.arrived=toTs(g("arrived")); l.departed=toTs(g("departed"));
    if(l.arrived&&l.departed&&l.departed<l.arrived) l.departed+=864e5;
    l.drink=byName(g("drink")); l.drinkAmt=g("drink_amount")||"all";
    l.items={};
    g("taken").split(";").map(x=>x.trim()).filter(Boolean).forEach(nm=>{
      const id=byName(nm); if(id) l.items[id]=1; else l.extra.push(nm);
    });
    g("refused").split(";").map(x=>x.trim()).filter(Boolean).forEach(nm=>{
      const id=byName(nm); if(id) l.items[id]=2;
    });
    g("other").split(";").map(x=>x.trim()).filter(Boolean).forEach(x=>l.extra.push(x));
    const num=v=>v===""?null:(isNaN(+v)?v:+v);
    l.gut=num(g("gut")); l.mood=num(g("mood")); l.legs=num(g("legs"));
    l.urine=num(g("urine")); l.layers=g("layers")||null; l.toilet=g("toilet")||"None";
    l.symptoms=g("symptoms").split(";").map(x=>x.trim()).filter(Boolean);
    l.newOnsets=g("new_onsets").split(";").map(x=>x.trim()).filter(Boolean);
    l.maint=g("maintenance").split(";").map(x=>x.trim()).filter(Boolean);
    l.notes=g("notes"); l.synced=false;
    if(/SWELLING/.test(g("flags"))) l.swell="yes";
    l.newOnsets.forEach(sy=>{ if(!onsets[sy]) onsets[sy]={lap:n,ts:l.arrived||now()}; });
    laps.push(l);
  });
  if(!laps.length) throw new Error("no lap rows found");
  laps.sort((a,b)=>a.n-b.n);
  S.laps=laps; S.onsets=onsets; S.cur=null;
  S.nextLap=laps[laps.length-1].n+1;
  save();
  return laps.length;
}

    <div class="kv"><span>Offline</span><b>${navigator.serviceWorker&&navigator.serviceWorker.controller?"ready":"not cached yet"}</b></div>
    <label class="f">Auto-backup a CSV every</label>
    <div class="seg sm">${[1,5,10].map(v=>`<button data-snap="${v}" aria-pressed="${(S.settings.snapEvery||1)===v}">${v===1?"lap":v+" laps"}</button>`).join("")}</div>
    <button class="big wide" id="updChk" style="width:100%;margin-top:14px">Check for update</button>
    <p class="hint">The app never updates itself. Don't check for updates during the race.</p>
    <div id="updMsg"></div>
  </section>

  <section class="card">
    <p class="eyebrow">Sheet sync</p>
    <p class="hint">Optional. The phone is the record; the sheet is a mirror. Rows queue and go up whenever there's signal.</p>
    <label class="f">Apps Script web app URL</label><input type="url" id="sUrl" value="${st.syncUrl||""}" placeholder="https://script.google.com/macros/s/…/exec">
    <label class="f">Shared secret</label><input type="text" id="sSec" value="${st.syncSecret||""}">
    <button class="big wide" id="saveSync" style="width:100%;margin-top:12px">Save sync settings</button>
    <button class="big wide" id="testSync" style="width:100%;margin-top:8px">Test connection</button>
    <button class="big wide" id="mkLink" style="width:100%;margin-top:8px">Copy setup link for another phone</button>
    <div id="syncMsg">${S.syncErr?`<div class="err">Last error: ${String(S.syncErr).replace(/</g,"&lt;").slice(0,220)}</div>`:""}${S.lastSync?`<p class="hint">Sheet last replied: <span class="mono">${String(S.lastSync).replace(/</g,"&lt;").slice(0,140)}</span></p>`:""}</div>
    <details style="margin-top:14px">
      <summary>Apps Script to paste in the sheet</summary>
<pre>var SECRET = 'CHANGE_ME';   // &lt;-- must match the secret box above

function doGet(){ return reply('OK:0'); }

function doPost(e){
  try {
    var d = JSON.parse(e.postData.contents);
    if (String(d.secret) !== String(SECRET)) return reply('ERR: wrong secret');
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var sh = ss.getSheetByName('laps') || ss.insertSheet('laps');
    if (sh.getLastRow() === 0) sh.appendRow(d.cols);
    var ids = sh.getRange(1,1,sh.getLastRow(),1).getValues()
                .map(function(x){ return String(x[0]); });
    d.rows.forEach(function(r){
      var f = ids.indexOf(String(r[0]));       // string compare, or it never matches
      if (f &gt; 0) sh.getRange(f+1,1,1,r.length).setValues([r]);
      else { sh.appendRow(r); ids.push(String(r[0])); }
    });
    SpreadsheetApp.flush();
    return reply('OK:' + d.rows.length);
  } catch (err) { return reply('ERR: ' + err); }
}

function reply(t){
  return ContentService.createTextOutput(t)
    .setMimeType(ContentService.MimeType.TEXT);
}</pre>
      <p class="hint"><b>Deploy → New deployment → Web app → Execute as: Me → Who has access: Anyone.</b> Not "Anyone with a Google account" — that returns a login page, which the old build counted as success. Any edit to the script needs a <i>new</i> deployment; editing alone leaves the old code live on the same URL.</p>
    </details>
  </section>`;
}

/* ============================================================
   EVENTS
   ============================================================ */
function bind(){
  const on = (sel,ev,fn)=>{ const el=$(sel); if(el) el.addEventListener(ev,fn); };

  on("#btnIn","click",()=>{
    S.cur = blankLap(S.nextLap);
    S.cur.arrived = now();
    save(); render(); startClock();
  });
  on("#undoIn","click",()=>{
    if(confirm("Discard this lap's capture and go back?")){ S.cur=null; save(); render(); }
  });
  const depart = ()=>{
    const l = S.cur;
    l.departed = now();
    S.laps.push(l);
    S.nextLap = l.n + 1;
    S.cur = null;
    save(); snapshot(l.n,false); queueSync(); render();
    toast(`Lap ${l.n} saved · ${mmss(l.departed-l.arrived)} in camp`);
  };
  on("#btnOut","click",depart);
  on("#btnOut2","click",depart);

  // drink
  document.querySelectorAll("[data-drink]").forEach(b=>b.addEventListener("click",()=>{
    S.cur.drink = (S.cur.drink===b.dataset.drink) ? null : b.dataset.drink;
    save(); render();
  }));
  document.querySelectorAll("[data-amt]").forEach(b=>b.addEventListener("click",()=>{
    S.cur.drinkAmt = b.dataset.amt; save(); render();
  }));

  // food chips: taken -> refused -> clear
  document.querySelectorAll("[data-item]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.item, cur=S.cur.items[id]||0, next=(cur+1)%3;
    if(next===0) delete S.cur.items[id]; else S.cur.items[id]=next;
    save(); render();
  }));
  document.querySelectorAll("[data-extra]").forEach(b=>b.addEventListener("click",()=>{
    S.cur.extra.splice(+b.dataset.extra,1); save(); render();
  }));
  on("#extraAdd","click",()=>{
    const v = $("#extraIn").value.trim();
    if(!v) return;
    S.cur.extra.push(v); save(); render();
  });
  on("#extraIn","keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#extraAdd").click(); } });

  // ratings
  document.querySelectorAll("[data-rate]").forEach(b=>b.addEventListener("click",()=>{
    const f=b.dataset.rate, raw=b.dataset.v, v=isNaN(+raw)?raw:+raw;
    S.cur[f] = (S.cur[f]===v) ? null : v;
    save(); render();
  }));

  // symptoms + onset stamping
  document.querySelectorAll("[data-sym]").forEach(b=>b.addEventListener("click",()=>{
    const s=b.dataset.sym, i=S.cur.symptoms.indexOf(s);
    if(i>=0){
      S.cur.symptoms.splice(i,1);
      const j=S.cur.newOnsets.indexOf(s);
      if(j>=0){ S.cur.newOnsets.splice(j,1); delete S.onsets[s]; }
    }else{
      S.cur.symptoms.push(s);
      if(!S.onsets[s]){
        S.onsets[s]={lap:S.cur.n, ts:now()};
        S.cur.newOnsets.push(s);
        toast(`First ${s.toLowerCase()} — lap ${S.cur.n}, ${hhmm(now())}`);
      }
    }
    save(); render();
  }));

  document.querySelectorAll("[data-toilet]").forEach(b=>b.addEventListener("click",()=>{
    S.cur.toilet=b.dataset.toilet; save(); render();
  }));
  document.querySelectorAll("[data-maint]").forEach(b=>b.addEventListener("click",()=>{
    const m=b.dataset.maint, i=S.cur.maint.indexOf(m);
    if(i>=0) S.cur.maint.splice(i,1); else S.cur.maint.push(m);
    save(); render();
  }));
  document.querySelectorAll("[data-swell]").forEach(b=>b.addEventListener("click",()=>{
    S.cur.swell=b.dataset.swell; save(); render();
    if(b.dataset.swell==="yes") showFlags(true);
  }));
  on("#notes","input",e=>{ S.cur.notes=e.target.value; save(); });
  on("#btnFlags","click",()=>showFlags(false));

  // log
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{
    const n=+b.dataset.open, i=S.laps.findIndex(l=>l.n===n);
    if(i<0) return;
    if(S.cur && !confirm("A lap is open. Discard it and edit lap "+n+"?")) return;
    S.cur = S.laps.splice(i,1)[0];
    S.cur.synced = false;
    S.tab="lap"; save(); render(); startClock();
    toast("Editing lap "+n+" — tap Departed to save it back");
  }));

  // export
  on("#dl","click",()=>{
    const blob = new Blob([buildCSV()],{type:"text/csv"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`lap-log-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  });
  on("#cp","click",async()=>{
    try{ await navigator.clipboard.writeText(buildCSV()); toast("CSV copied"); }
    catch(e){ $("#csvBox").select(); toast("Select and copy from the box"); }
  });
  on("#shareBtn","click",async()=>{
    try{
      const f=new File([buildCSV()],"lap-log.csv",{type:"text/csv"});
      if(navigator.canShare && navigator.canShare({files:[f]})) await navigator.share({files:[f],title:"Lap log"});
      else await navigator.share({text:buildCSV(),title:"Lap log"});
    }catch(e){ toast("Sharing unavailable — use Download"); }
  });
  on("#syncNow","click",()=>queueSync(true));
  on("#backupNow","click",()=>snapshot(S.laps.length?S.laps[S.laps.length-1].n:0,true));
  on("#recOpfs","click",async()=>{
    const out=$("#recMsg");
    const txt=await opfsRead();
    if(!txt){ out.innerHTML=`<div class="err">Nothing in the device store.</div>`; return; }
    if(!confirm("Replace everything in this app with the device store copy?")) return;
    try{ const n=importCSV(txt); render(); toast(n+" laps recovered"); }
    catch(e){ out.innerHTML=`<div class="err">${String(e.message)}</div>`; }
  });
  on("#recFile","click",()=>$("#fileIn").click());
  on("#fileIn","change",async e=>{
    const f=e.target.files[0]; if(!f) return;
    const out=$("#recMsg");
    try{
      const txt=await f.text();
      if(!confirm(`Replace everything with ${f.name}?`)) return;
      const n=importCSV(txt); render(); toast(n+" laps recovered");
    }catch(err){ out.innerHTML=`<div class="err">${String(err.message)}</div>`; }
  });
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.addEventListener("click",()=>{
    S.settings.theme=b.dataset.themeSet; save(); applyTheme(); render();
  }));
  document.querySelectorAll("[data-snap]").forEach(b=>b.addEventListener("click",()=>{
    S.settings.snapEvery=+b.dataset.snap; save(); render();
  }));
  on("#updChk","click",async()=>{
    const out=$("#updMsg");
    if(S.cur||S.laps.length){ if(!confirm("A race is in progress. Updating mid-race is risky. Continue?")) return; }
    out.innerHTML=`<p class="hint">Checking…</p>`;
    try{
      if(!swReg){ out.innerHTML=`<div class="err">No service worker registered.</div>`; return; }
      await swReg.update();
      if(swReg.waiting){
        out.innerHTML=`<div class="warn">A new version is ready. <b>Reload twice</b> to load it.</div>`;
        swReg.waiting.postMessage({type:"SKIP_WAITING"});
      } else {
        out.innerHTML=`<p class="hint">Already on the latest cached version (${APP_VERSION}).</p>`;
      }
    }catch(e){ out.innerHTML=`<div class="err">Couldn't check — probably offline.</div>`; }
  });
  on("#wipe","click",()=>{
    if(!confirm("Erase every lap? This cannot be undone.")) return;
    if(!confirm("Really erase? Export first if you haven't.")) return;
    S.laps=[]; S.cur=null; S.onsets={}; S.nextLap=1; save(); render(); toast("Erased");
  });

  // setup
  const sset=(id,key,cast)=>on(id,"change",e=>{
    S.settings[key]=cast?cast(e.target.value):e.target.value; save();
  });
  sset("#sName","raceName"); sset("#sStart","startTime");
  sset("#sLaps","targetLaps",v=>parseInt(v,10)||48);
  sset("#sMiles","lapMiles",v=>parseFloat(v)||4.161);
  on("#savePlan","click",()=>{
    S.settings.planText=$("#sPlan").value;
    PLAN=parsePlan(S.settings.planText);
    save();
    const lines=Object.keys(PLAN).length;
    const unmatched=(S.settings.planText.match(/\n/g)||[]).length+1-lines;
    $("#planMsg").innerHTML = lines
      ? `<div class="warn">${lines} lap${lines===1?"":"s"} loaded${unmatched>0?` · ${unmatched} line${unmatched===1?"":"s"} not recognised`:""}.</div>`
      : `<div class="err">Nothing recognised. Each line needs a lap number first.</div>`;
  });
  on("#saveSync","click",()=>{
    S.settings.syncUrl=$("#sUrl").value.trim();
    S.settings.syncSecret=$("#sSec").value.trim();
    save(); syncBadge(); toast("Sync settings saved");
  });
  on("#mkLink","click",async()=>{
    const u=$("#sUrl").value.trim(), sec=$("#sSec").value.trim();
    if(!u){ $("#syncMsg").innerHTML=`<div class="err">Set the URL first.</div>`; return; }
    const link = location.origin + location.pathname
      + "?u=" + encodeURIComponent(u)
      + (sec?"&s="+encodeURIComponent(sec):"")
      + (S.settings.planText?"&p="+encodeURIComponent(S.settings.planText):"");
    try{ await navigator.clipboard.writeText(link); toast("Setup link copied"); }
    catch(e){ /* fall through to showing it */ }
    $("#syncMsg").innerHTML =
      `<div class="warn">Opening this link on another phone sets up sync${S.settings.planText?" and loads the plan":""}. It carries the secret — send it somewhere private, not the repo.</div>
       <textarea readonly style="min-height:70px;font-size:11px" onclick="this.select()">${link.replace(/</g,"&lt;")}</textarea>`;
  });
  on("#testSync","click",async()=>{
    S.settings.syncUrl=$("#sUrl").value.trim();
    S.settings.syncSecret=$("#sSec").value.trim();
    save();
    const out=$("#syncMsg");
    if(!S.settings.syncUrl){ out.innerHTML=`<div class="err">No URL.</div>`; return; }
    out.innerHTML=`<p class="hint">Testing…</p>`;
    try{
      const {res,txt,bytes}=await postToSheet(S.settings.syncUrl,S.settings.syncSecret,COLS,[]);
      S.lastSync=`${res.status} · ${bytes}B · ${txt.slice(0,120)}`;
      let verdict;
      if(txt.indexOf("OK:")===0) verdict=`<div class="warn" style="color:var(--green);border-color:var(--green)">Working. The sheet answered and wrote 0 test rows.</div>`;
      else if(/<html/i.test(txt)) verdict=`<div class="err">Google returned HTML, not the script's reply. Redeploy with access set to <b>Anyone</b>.</div>`;
      else if(/wrong secret/i.test(txt)) verdict=`<div class="err">Wrong secret. The SECRET line in the script doesn't match the box above.</div>`;
      else verdict=`<div class="err">Unexpected reply — the script may be an old deployment.</div>`;
      out.innerHTML=verdict+`<p class="hint">HTTP ${res.status} · sent ${bytes} bytes · reply: <span class="mono">${txt.replace(/</g,"&lt;").slice(0,140)}</span></p>
        <p class="hint">URL in use: <span class="mono" style="word-break:break-all">${S.settings.syncUrl.replace(/</g,"&lt;")}</span></p>`;
      S.syncErr=""; save();
    }catch(err){
      out.innerHTML=`<div class="err">Couldn't reach it: ${String(err.message||err).replace(/</g,"&lt;")}</div>
        <p class="hint">If you're offline that's expected. If you're online, check the URL ends in <span class="mono">/exec</span> — not <span class="mono">/dev</span>.</p>`;
    }
  });
  document.querySelectorAll("[data-p]").forEach(inp=>inp.addEventListener("change",()=>{
    const p=S.products[+inp.dataset.p];
    p[inp.dataset.k]=parseFloat(inp.value)||0;
    if(p.unset && (p.kcal||p.carb||p.na)) { delete p.unset; p.note="edited"; }
    save();
  }));
}

/* nav */
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
  S.tab=b.dataset.tab; save(); render();
  if(S.tab==="lap" && S.cur) startClock(); else stopClock();
}));

/* clock */
let clockTimer=null;
function startClock(){
  stopClock();
  clockTimer=setInterval(()=>{
    const el=$("#ct");
    if(!el||!S.cur){ stopClock(); return; }
    el.textContent = mmss(now()-S.cur.arrived);
  },1000);
}
function stopClock(){ clearInterval(clockTimer); clockTimer=null; }

/* red flags */
function showFlags(fromSwelling){
  const d=document.createElement("div");
  d.className="scrim";
  d.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <h3>${fromSwelling?"Swelling logged — read this":"Stop and get medical help"}</h3>
    ${fromSwelling?`<p style="font-size:15px">Swollen hands or fingers alongside a lot of fluid is a hyponatremia sign. <b>Stop plain water now</b> and go to race medical. Don't work around it with the plan.</p>`:""}
    <ul>
      <li>Swollen hands or fingers, or weight gain during the race</li>
      <li>Confusion, or a headache with high fluid intake</li>
      <li>Chest pain</li>
      <li>No urination for more than 8 hours</li>
      <li>Dark cola-coloured urine</li>
      <li>Repeated vomiting with nothing staying down</li>
    </ul>
    <p style="font-size:14px;color:var(--muted);margin-top:12px">Any of these: race medical, not a plan tweak.</p>
    <button class="big wide" id="closeFlags" style="width:100%;margin-top:14px">Close</button>
  </div>`;
  document.body.appendChild(d);
  d.querySelector("#closeFlags").addEventListener("click",()=>d.remove());
  d.addEventListener("click",e=>{ if(e.target===d) d.remove(); });
}

/* sync — queue and drain, never blocking */
function syncBadge(txt,cls){
  const b=$("#bSync");
  if(!S.settings.syncUrl){ b.textContent="sync off"; b.className="badge"; return; }
  const q=S.laps.filter(l=>!l.synced).length;
  b.textContent = txt || (q ? q+" queued" : "synced");
  b.className = "badge " + (cls || (q ? "" : "on"));
}
/* one code path for both the test and the real send */
async function postToSheet(url, secret, cols, rows){
  const body = JSON.stringify({secret, cols, rows});
  const res = await fetch(url,{
    method:"POST",
    redirect:"follow",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body
  });
  const txt = (await res.text()).trim();
  return {res, txt, bytes: body.length};
}

let syncing=false;
async function queueSync(manual){
  if(!S.settings.syncUrl){ if(manual) toast("No sheet URL set"); syncBadge(); return; }
  const pending=S.laps.filter(l=>!l.synced);
  if(!pending.length){ syncBadge(); if(manual) toast("Nothing waiting"); return; }
  if(syncing) return;
  syncing=true; syncBadge("sending…");
  try{
    const all=buildCSV().split("\n");
    const cols=all[0].split(",");
    const allRows=pending.map(l=>parseCSVLine(all[S.laps.indexOf(l)+1]));
    // send in small batches — a large body is a plausible cause of a
    // 404 from Google when a tiny one succeeds
    const BATCH=10;
    let done=0, lastBytes=0;
    for(let i=0;i<allRows.length;i+=BATCH){
      const slice=allRows.slice(i,i+BATCH);
      const {res,txt,bytes}=await postToSheet(S.settings.syncUrl,S.settings.syncSecret,cols,slice);
      lastBytes=bytes;
      S.lastSync=`${res.status} · ${bytes}B · ${txt.slice(0,120)}`;
      if(!res.ok) throw new Error(`HTTP ${res.status} on a ${bytes}-byte send (${slice.length} rows). URL used: ${S.settings.syncUrl}`);
      if(txt.indexOf("OK:")!==0) throw new Error(
        /<html/i.test(txt)
          ? "Google sent HTML, not the script's reply. Redeploy with access set to Anyone."
          : "Sheet rejected it: "+(txt.slice(0,80)||"empty reply"));
      pending.slice(i,i+BATCH).forEach(l=>l.synced=true);
      done+=slice.length;
      save(); syncBadge();
    }
    S.syncErr=""; save(); syncBadge();
    if(manual) toast(`Sheet confirmed ${done} row(s) · ${lastBytes}B`);
  }catch(e){
    S.syncErr=String(e.message||e); save();
    syncBadge(navigator.onLine?"rejected":"offline","off");
    if(manual) toast(S.syncErr.slice(0,90));
  }finally{ syncing=false; }
}
function parseCSVLine(line){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){
      if(c==='"'&&line[i+1]==='"'){cur+='"';i++;}
      else if(c==='"') q=false;
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===",") {out.push(cur);cur="";}
      else cur+=c;
    }
  }
  out.push(cur); return out;
}
setInterval(()=>{ if(navigator.onLine) queueSync(false); },90000);
window.addEventListener("online",()=>queueSync(false));

/* keep the screen honest about unsaved work */
window.addEventListener("beforeunload",e=>{ if(S.cur){ e.preventDefault(); e.returnValue=""; } });

/* ---- provisioning link: ?u=<script url>&s=<secret> ----
   Lets a spare phone be set up from one link without the URL or secret
   ever living in the repo. Consumed once, then wiped from the address
   bar and from history so it isn't left on screen. */
(function provision(){
  try{
    const q = new URLSearchParams(location.search);
    const u = q.get("u"), sec = q.get("s"), plan = q.get("p");
    if(!u && !sec && !plan) return;
    if(u)    S.settings.syncUrl    = decodeURIComponent(u);
    if(sec)  S.settings.syncSecret = decodeURIComponent(sec);
    if(plan){ S.settings.planText  = decodeURIComponent(plan); PLAN = parsePlan(S.settings.planText); }
    lsSave(S); idbSave(S);
    history.replaceState(null,"",location.pathname);
    S.provisioned = [u?"sheet URL":null, sec?"secret":null, plan?"plan":null].filter(Boolean).join(", ");
  }catch(e){}
})();

/* boot */
applyTheme();
persistOK = lsSave(S);
render();
if(S.provisioned){ toast("Set up from link: "+S.provisioned); delete S.provisioned; save(); }
if(S.cur) startClock();
syncBadge();
const b=$("#bSave");
b.textContent = persistOK ? "saved" : "no storage";
b.className = "badge " + (persistOK?"on":"off");
</script>
